{{define "content"}}
<div class="auth-shell">
  {{template "auth-aside"}}
  <section class="auth-content">
    <a class="back-link" href="/login">← Back to log in</a>
    <div class="auth-form-wrap">
      <span class="large-icon">{{template "icon-lock"}}</span><span class="eyebrow">A FRESH START</span>
      <h1>
        Set a new password.
      </h1>
      <p class="page-description">
        For {{.Data.Email}}.
      </p>
      <form method="post" action="/reset" class="auth-form">
        <input type="hidden" name="token" value="{{.Data.Token}}">
        <label>
          New password<input type="password" name="password" minlength="10" maxlength="72" required autocomplete="new-password" placeholder="At least 10 characters">
        </label>
        <label>
          New password again<input type="password" name="again" minlength="10" maxlength="72" required autocomplete="new-password" placeholder="Repeat your new password">
        </label>
        <button class="full-width">Set password {{template "icon-arrow"}}</button>
      </form>
      <p class="auth-trust">
        {{template "icon-shield"}} Use a password you don't use anywhere else.
      </p>
    </div>
  </section>
</div>
{{end}}
