{{define "content"}}
<h1>Log in</h1>
<form method="post" action="/login" class="card narrow">
  <label>Email <input type="email" name="email" value="{{with .Data}}{{.Email}}{{end}}" required autocomplete="email"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button>Log in</button>
  <p class="muted">No account yet? <a href="/signup">Sign up</a>.</p>
</form>
{{end}}
