{{define "chart"}}
<h3>Equity <span class="muted">· hourly, against buy and hold</span></h3>
{{if lt .Points 2}}<p class="muted">No equity history yet; the first point arrives at the top of the hour.</p>{{else}}
<svg viewBox="0 0 {{.Width}} {{.Height}}" class="chart" role="img" aria-label="Equity {{.Last}} against buy and hold {{.LastBench}}">
  <path class="bench" d="{{.BuyAndHold}}"/>
  <path class="{{if .Up}}equity up{{else}}equity down{{end}}" d="{{.Equity}}"/>
</svg>
<p class="muted"><span>{{.From}} – {{.To}} UTC</span> · <span>range {{.Min}} – {{.Max}}</span> · <span>now {{.Last}}, buy and hold {{.LastBench}}</span></p>
{{end}}
{{end}}
