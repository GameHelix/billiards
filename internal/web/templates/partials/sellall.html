{{define "sellall"}}
<div class="card warn sell-confirm" role="alert">
  <span class="icon-tile amber">{{template "icon-info"}}</span>
  <div>
    <h2>
      A moment to confirm.
    </h2>
    <p>
      Sell everything {{.Name}} holds and stop trading?
    </p>
    <p class="muted">
      This sells the agent's current holdings at market prices.
    </p>
    <div class="control-buttons">
      <button class="danger" hx-post="/agents/{{.ID}}/commands" hx-disabled-elt="this" hx-vals='{"command": "sell_all", "confirm": "yes"}' hx-target="#status">Yes, sell everything</button><button class="quiet" hx-get="/agents/{{.ID}}/sellall?cancel=1" hx-target="#confirm">Cancel</button>
    </div>
  </div>
</div>
{{end}}
